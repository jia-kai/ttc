# Active-assignment message diagnostics. Role instructions live in system.yaml.
ChildMessageNonempty: message must be nonempty UTF-8
ChildMessageTarget:
  prefer the assignment's job_id, or supply both child_id and child_turn_id
ChildMessageOwnership: only main can message a child assignment
ChildMessageInactive:
  target child assignment is no longer active; message was not queued
ChildAdmissionAfterCompaction: child request input does not fit after compaction
ChildMessageEvidenceTarget:
  child message evidence does not match the admitted assignment
ChildMessageQueueCapacity:
  "message was not queued: pending guidance has at most %d estimated wire tokens
  remaining and %d messages total; shorten it or wait for delivery before
  sending more (routing/escaping overhead counts)"
