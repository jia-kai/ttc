# Authored session tool guidance, model-input scaffolds and diagnostics delivered
# through tool results or child handoffs. Preserve printf slots and whitespace.
ChildExplicitPersistence:
  persistent must be explicitly true or false on every assignment; use false for
  a disposable child
ChildNonemptyVariant:
  variant must be nonempty; omit it to inherit the current reasoning selection
ChildFollowupLabel:
  a follow-up label must match the existing child's title after whitespace
  normalization
ChildValidLabel:
  choose a label of 1–4 words and at most 64 characters, on one line without
  controls; shorten the name and retry
ChildCannotAssign: children cannot spawn children or assign follow-ups
ChildUnknownFollowup: unknown or closed child_id; create a fresh child
ChildFollowupBusy:
  child is still running; wait for child_turn_finished before assigning a
  follow-up
ChildUnsupportedVariant:
  "unsupported variant %q for %s; supported variants: %s; choose one or omit
  variant to retain the current selection"
ChildCapacity:
  all %d child slots are occupied; close an idle child with
  job_stop(child_id=...) or wait for a running aside to finish
ChildResponseTooLarge: child response exceeds %d bytes
ChildCompletedWithoutText: child completed without assistant text
ImageClicksUnsupported:
  image clicks require the Kitty graphics/mouse TUI; omit request_click to
  display without requesting a point
ImageSelectionPending:
  an image selection is pending or its reply is unconsumed; wait for and process
  that reply before requesting another click
QuestionCount: require 1–3 questions
QuestionIdentityAndPrompt: question IDs must be unique and prompts nonempty
QuestionChoiceCount: nonempty options require 2–5 choices
QuestionOptionIdentityAndLabel:
  option IDs must be nonempty and unique within each question; labels must be
  nonempty
QuestionRecommendation: recommended_option_id must identify an existing option
QuestionMainOnly: question is available only to the main agent
QuestionIntent: "question intent: %w"
QuestionAlreadyPending: a main question is already pending
WakeupEncodeStartup: "encode wakeup startup parameters: %w"
WakeupNameActive:
  wakeup name already active; use wakeup_update to change it atomically or
  choose another name
WakeupTimeRequired: exactly one of at or delay_seconds required
WakeupDelayRange: delay_seconds must be 0–31536000
WakeupInvalidTimestamp:
  "at must be RFC3339 with a timezone, such as 2026-10-02T15:04:05Z; use
  delay_seconds instead for a relative time: %w"
WakeupCancelIdentity:
  supply wakeup_id or name; if both are supplied they must identify the same
  active reminder
WakeupCancelNotFound:
  no scheduled reminder matches; use wakeup_list and choose an active wakeup_id
  or name
SessionToolInterrupted: stream did not complete; tool was not executed
SessionToolIntentMismatch: tool call/intent count mismatch
SessionToolResultBudget: >-
  Result delivery withheld: this result or the aggregate tool-result batch
  reaches 20% of the producing model's context capacity. Request smaller pages,
  narrower searches or fewer results per batch. This is not a tool-execution
  failure: commands or mutations may already have completed. Do not rerun
  side-effecting tools merely to retrieve output; inspect the retained result or
  job with bounded reads instead.
SessionToolResultRetention: "retain oversized tool result: %w"
SessionToolResultByteLimit: >-
  Result delivery withheld: JSON exceeds the 64-KiB per-result limit. Narrow
  read-only queries or use bounded extraction from detail_path. Execution may
  already have succeeded; do not rerun commands or mutations merely to retrieve
  output. Full execution evidence and attachment references remain retained.
SessionUnusableAfterCompaction:
  "session unusable after compaction: %s; inspect/export history or start/load
  another session"
SessionNamingTruncated: "\n[truncated]"
SessionNamingTool: "\nTool: "
SessionSummaryMessageHeader: "\n### %s"
SessionSummaryCallID: " · %s"
SessionSummaryToolCall: "Tool call %s · %s\n%s\n"
SessionSummaryBinaryAttachment: "Binary attachment (%s): %s\n"
SessionCompactionHeadroom: >-
  The child's context is still too large after compaction, so the assignment
  failed and the child is closed. Inspect any returned partial answer and
  transcript paths. Continue the remaining work yourself, or create a new child
  with a narrower task, a concise handoff and bounded reads. Do not retry the
  same assignment unchanged or send a follow-up to the closed child. Main-owned
  jobs and timers remain live. Do not rerun commands or mutations merely to
  recover their output.
SessionCompactionInputTooLarge:
  compaction input exceeds model context (estimated input %d + output/margin
  reserve %d, limit %d tokens); no summary was requested
SessionRecordCompactionResult: "record compaction result: %w"
SessionCompactionNoTools: compaction response must not call tools
SessionCompactionSummaryTooLarge: compaction summary exceeds 1 MiB
SessionCompactionEmptySummary: empty compaction summary
ChildCompactionIdentity:
  child compaction requires actor identity and tool registry
SessionProviderNilCall: provider emitted nil call
SessionInvalidPartialRecovery: provider emitted invalid partial recovery
SessionReadRecoveryInstructions: "read recovery instructions: %w"
SessionRecordRecoveryInstructions: "record recovery instructions: %w"
SessionRecordModelRetry: "record model retry: %w"
SessionInvalidRetryNotice: provider emitted invalid retry notice
SessionInvalidToolAnnouncement: provider emitted invalid tool announcement
SessionRecordToolAnnouncement: "record tool announcement: %w"
SessionInvalidToolProgress: provider emitted invalid tool progress
SessionReadProjectInstructions: "read project instructions %s: %w"
SessionNotificationSource:
  notification source must be an original committed event
SessionNotificationJSON: notification must contain valid JSON
SessionEventAlreadyPending: event already pending delivery
SessionRecoveredNotificationProjection: "project recovered notification %d: %w"
