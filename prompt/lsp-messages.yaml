# Authored LSP validation, recovery, and read-only guidance.
# Includes TTC-authored framing diagnostics and protocol error captions.
# Raw server replies and underlying I/O error payloads remain data.
LSPInitializationFailed: "language server initialization failed or was interrupted; stop and restart with available lifecycle tools, use another accessible server, or report the missing server"
LSPInitializeCapabilitiesMissing: "LSP initialize returned no capabilities; restart a correctly configured server with available lifecycle tools, use another accessible server, or report the configuration issue"
LSPInvalidPositionEncoding: "invalid LSP positionEncoding"
LSPUnsupportedPositionEncoding: "language server chose an unsupported position encoding; use an accessible server supporting UTF-8, UTF-16 or UTF-32, configure/restart with available lifecycle tools, or report the configuration issue"
LSPInvalidTextDocumentSync: "invalid LSP textDocumentSync"
LSPInvalidTextDocumentSyncChangeKind: "invalid LSP textDocumentSync change kind"
LSPInvalidPagination: "offset must be nonnegative and limit must be 1–500"
LSPInvalidOperation: "operation must be definition, references, hover, document_symbols or workspace_symbols"
LSPUnsupportedOperation: "language server does not advertise %s; choose another operation or server"
LSPPathRequired: "path is required for this operation"
LSPLocalFileURIRequired: "LSP result needs a local file URI; virtual/remote documents are unsupported"
LSPReadFileFailed: "read LSP file %s: %w; check path and permissions"
LSPRegularFileRequired: "LSP input must be a regular UTF-8 file of at most 8 MiB; use another inspection tool for unsupported files"
LSPInvalidFileText: "LSP input must contain at most 8 MiB of UTF-8 text without NUL"
LSPLanguageIDRequired: "cannot infer language_id from this extension; specify the language server's language_id"
LSPInvalidLine: "line must be 1-based and positive"
LSPLineBeyondFile: "line %d is beyond the file; read it and choose an existing line"
LSPInvalidColumn: "column must be a 1-based Unicode code-point column"
LSPColumnBeyondLine: "column %d exceeds line %d's end column %d; use Unicode code-point columns, not bytes"
LSPPositionOutsideFile: "language server returned a position outside the file; synchronize edited files with file queries and retry once, then inspect server diagnostics if it persists"
LSPPositionInsideCharacter: "LSP returned a character offset inside an encoded Unicode character"
LSPLanguageIDChanged: "language_id changed for an open document; use its original language_id or restart with available lifecycle tools; otherwise report the server limitation"
LSPTextChangesUnsupported: "language server does not support text changes; after editing, stop and restart with available lifecycle tools or use another accessible server; otherwise report stale-server limitations"
LSPServerStopped: "language server stopped; use another accessible server or start a new protocol=lsp job if shell is available; otherwise report the missing server"
LSPServerStoppedInspect: "language server stopped; inspect job_read(stream=stderr), then use another accessible server or start a new protocol=lsp job if shell is available; otherwise report the missing server"
LSPInvalidFraming: "invalid LSP framing; with available lifecycle tools, restart using exec SERVER and emit no ordinary stdout; otherwise use another accessible server or report the configuration issue: %s"
LSPInvalidHeader: "invalid or oversized LSP header"
LSPExpectedContentLength: "expected Content-Length framing"
LSPDuplicateContentLength: "duplicate Content-Length"
LSPInvalidContentLength: "Content-Length must be 1–8388608 bytes"
LSPMissingContentLength: "missing Content-Length"
LSPOutputClosed: "language server output closed; inspect job_read(stream=stderr), then restart with available lifecycle tools or use another accessible server; otherwise report the missing server"
LSPInvalidJSONRPCMessage: "invalid language server JSON-RPC message; restart with a stdio LSP server using available lifecycle tools, use another accessible server, or report the configuration issue"
LSPRequestTooLarge: "LSP request exceeds 8 MiB; reduce query input or use another inspection tool for this file"
LSPWriteInterrupted: "LSP write interrupted; restart with available lifecycle tools or use another accessible server; otherwise report the missing server"
LSPInputClosed: "language server stdin closed; inspect stderr, then restart with available lifecycle tools or use another accessible server; otherwise report the missing server"
LSPPipeNoProgress: "language server pipe made no progress; restart with available lifecycle tools or use another accessible server; otherwise report the server limitation"
LSPServerError: "LSP %s error %d: %s; check path/position and server configuration, then retry"
LSPReplyMissingResult: "LSP reply has no result or error; restart with available lifecycle tools or use another accessible server; otherwise report the server limitation"
LSPReadOnlyEdits: "TTC LSP queries are read-only; use file-mutation tools when available for changes, otherwise report proposed changes"
LSPConfigurationItemsLimit: "configuration requires at most 256 items"
LSPClientCapabilityUnsupported: "TTC does not advertise this client capability"
LSPResultSourcesTooLarge: "LSP result source files exceed 16 MiB; reduce limit and page with offset"
LSPReversedSourceRange: "LSP returned a reversed source range"
LSPResultListRequired: "LSP result must be a list of source locations/symbols"
LSPInvalidLocation: "invalid LSP location"
LSPLocationMissingRange: "LSP location has no source range"
LSPInvalidHoverResult: "invalid LSP hover result"
LSPInvalidHoverContents: "invalid LSP hover contents"
LSPSymbolHierarchyTooDeep: "LSP symbol hierarchy exceeds 64 levels; narrow the workspace query or use another server"
LSPInvalidSymbol: "invalid LSP symbol"
LSPInvalidResolvedSymbol: "invalid resolved workspace symbol"
LSPSymbolMissingLocation: "LSP symbol has no source location; use a server supporting source ranges"
