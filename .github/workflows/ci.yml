name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-test:
    name: CI test
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check Markdown and YAML formatting
        run: make format-check

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap tmux zsh openssh-client ripgrep diffutils python3 librsvg2-bin

      - name: Enable and verify sandbox namespaces
        run: |
          # This is a disposable GitHub-hosted VM, not a developer's host.
          # Ubuntu's AppArmor restriction otherwise blocks user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          bwrap --unshare-user --unshare-pid --unshare-uts \
            --ro-bind / / --proc /proc --dev /dev -- /bin/true

      - name: Check Go formatting
        run: |
          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Run CI tests
        run: |
          set -o pipefail
          make ci-test 2>&1 | tee "$RUNNER_TEMP/ci-test.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-diagnostics
          path: |
            ${{ runner.temp }}/ci-test.log
            /tmp/ttc/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
